name: Render Report
on:
  push:
  workflow_dispatch:
jobs:
  render-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # charged-ieee typesets in TeX Gyre Termes/Cursor, which the GitHub runner
      # image does not ship. Without these the PDF silently falls back to
      # Typst's default fonts and is not in the IEEE style.
      - run: sudo apt-get update && sudo apt-get install -y fonts-texgyre
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: v0.15.1
      - run: typst compile cee492_report.typ cee492_report.pdf
      - uses: actions/upload-artifact@v5
        with:
            name: cee 492 report pdf
            path: cee492_report.pdf
